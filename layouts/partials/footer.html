<footer class="site-footer">
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <a class="brand" href="{{ .Site.Home.RelPermalink }}">
        <span class="mark" aria-hidden="true">{{ partial "mark.html" . }}</span>
        <span class="wordmark">Debate Across<br>Arkansas</span>
      </a>
      <p>A nonprofit supporting speech and debate in Arkansas.</p>
      <p class="fine">This first version of the site uses placeholder copy.</p>
    </div>
    <nav aria-label="Footer">
      <ul>
        <li><a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a></li>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
  <div class="wrap footer-base">
    <p>© {{ now.Year }} Debate Across Arkansas</p>
  </div>
</footer>
